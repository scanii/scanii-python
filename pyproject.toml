[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scanii"
version = "1.0.0"
description = "Zero-dependency Python SDK for the Scanii content security API"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.13"
authors = [{ name = "Scanii" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov", "mypy", "ruff"]

[project.urls]
Homepage = "https://scanii.com"
Repository = "https://github.com/scanii/scanii-python"
Documentation = "https://scanii.github.io/openapi/v22/"

[tool.hatch.build.targets.wheel]
packages = ["src/scanii"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
